[package]
name = "frenz-py"
description = "Python bindings for the FRENZ brainband client (built into the openfrenz wheel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
frenz = { workspace = true }
frenz-export = { workspace = true }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
