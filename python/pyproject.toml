[project]
name = "openfrenz"
version = "0.3.0"
description = "Unofficial tools for the FRENZ brainband: connect, stream and record from Python, and load exported sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=15"]

[project.urls]
Repository = "https://github.com/ljchang/openfrenz"
Documentation = "https://github.com/ljchang/openfrenz/blob/main/docs/PYTHON.md"

[project.scripts]
frenz = "openfrenz._cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
polars = ["polars>=1.0"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
# The compiled part lives in the Rust workspace; the Python modules sit next to this file.
manifest-path = "../crates/frenz-py/Cargo.toml"
module-name = "openfrenz._native"
python-source = "."
