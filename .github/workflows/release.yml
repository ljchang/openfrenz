name: Release

# Builds the Python wheels on every pull request that touches them, and publishes them to PyPI
# when a version tag is pushed.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "python/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, test: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, test: true }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist
      # Install the wheel that was just built and run the tests against it. They replay a
      # synthetic recording, so no band and no Bluetooth are needed.
      - if: matrix.test
        shell: bash
        run: |
          # Install the wheel file itself: by name, pip could pick the same version from PyPI.
          python -m pip install python/dist/*.whl pytest polars
          frenz --version
          mkdir wheel-test && cd wheel-test
          frenz synth demo.sqlite --seconds 60
          frenz export demo.sqlite -o sessions
          OPENFRENZ_SESSIONS=sessions python -m pytest -q ../python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no token is stored in this repository
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          version=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
