name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests, property tests, and the end-to-end tests on a synthetic recording.
      - run: cargo test --workspace
      # The decoders must also build without the standard library.
      - run: cargo build -p frenz-proto --no-default-features

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # Full pipeline: synthetic recording -> summary -> export -> load and window in Python.
      - run: |
          cargo build --release -p frenz-cli
          ./target/release/frenz synth demo.sqlite --seconds 60
          ./target/release/frenz summary demo.sqlite
          ./target/release/frenz export demo.sqlite -o sessions
      - working-directory: python
        run: |
          uv venv --python 3.12
          uv pip install -e '.[test]'
          OPENFRENZ_SESSIONS=../sessions .venv/bin/python -m pytest -q
