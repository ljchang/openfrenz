[workspace]
resolver = "3"
members = ["crates/frenz-proto", "crates/frenz", "crates/frenz-export", "crates/frenz-model", "crates/frenz-cli", "crates/frenz-py"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ljchang/openfrenz"
description = "Unofficial open-source interface to the FRENZ brainband over Bluetooth LE"

[workspace.dependencies]
frenz-proto = { path = "crates/frenz-proto", version = "0.3.0" }
frenz = { path = "crates/frenz", version = "0.3.0" }
frenz-export = { path = "crates/frenz-export", version = "0.3.0" }
frenz-model = { path = "crates/frenz-model", version = "0.3.0" }
frenz-cli = { path = "crates/frenz-cli", version = "0.3.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
